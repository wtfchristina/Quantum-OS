<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum-OS // Authenticated Cockpit</title>
  <style>
    body { margin: 0; overflow: hidden; background: #060911; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(10, 15, 29, 0.92); border: 1px solid #1a2744;
      border-radius: 8px; padding: 18px 24px; color: #a4b3d6; font-size: 13px;
      backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      width: 330px;
    }
    #hud h1 { margin: 0 0 12px 0; font-size: 13px; letter-spacing: 1.5px; color: #00ffcc; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
    .val { font-weight: 600; color: #ffffff; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-ok { background: #00ffcc22; color: #00ffcc; }
    .badge-alert { background: #ff005533; color: #ff3366; border: 1px solid #ff0055; }
    hr { border: none; border-top: 1px solid #1a2744; margin: 12px 0; }
    .control-label { font-size: 11px; color: #7388b6; margin-bottom: 4px; display: block; }
    input[type=range] { width: 100%; accent-color: #00ffcc; margin-bottom: 8px; }
    .btn {
      width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ff3366;
      background: #ff336622; color: #ff3366; font-family: monospace; font-weight: bold;
      cursor: pointer;
    }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h1>Quantum-OS Telemetry HUD</h1>
    <div class="row"><span>Status:</span><span id="status-badge" class="badge badge-ok">AUTHENTICATED</span></div>
    <div class="row"><span>Frame Tick:</span><span id="tick" class="val">0</span></div>
    <div class="row"><span>QBER (BB84):</span><span id="qber" class="val">0.00%</span></div>
    <div class="row"><span>Active KME ID:</span><span id="kme" class="val">--</span></div>
    <div class="row"><span>Session Key (SHA256):</span><span id="key" class="val">--</span></div>
    <div class="row"><span>Curvature Metric (g_00):</span><span id="r00" class="val">1.000000</span></div>
        <div class="row"><span>PINN Hamiltonian Loss:</span><span id="pinn-loss" class="val">0.000000</span></div>
        <div class="row"><span>Christoffel Gamma^r:</span><span id="gamma-r" class="val">0.000000</span></div>
    <hr>
    <label class="control-label">Curvature Mesh Amplitude</label>
    <input type="range" id="amp-slider" min="0.1" max="5.0" step="0.1" value="1.5">
    <label class="control-label">Camera Altitude</label>
    <input type="range" id="alt-slider" min="5" max="50" step="1" value="15">
    <button id="attack-btn" class="btn" onclick="toggleAttack()">INJECT EVE INTERCEPT</button>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060911, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const size = 36, divisions = 40;
    const geometry = new THREE.PlaneGeometry(size, size, divisions, divisions);
    geometry.rotateX(-Math.PI / 2);
    const count = geometry.attributes.position.count;
    const colors = new Float32Array(count * 3);
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.9 });
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    let targetCurvature = 1.0;
    let amplitude = 1.5;
    let attackMode = false;
    const pos = geometry.attributes.position;
    const colAttr = geometry.attributes.color;

    document.getElementById('amp-slider').addEventListener('input', (e) => amplitude = parseFloat(e.target.value));
    document.getElementById('alt-slider').addEventListener('input', (e) => {
      camera.position.y = parseFloat(e.target.value);
      camera.lookAt(0, 0, 0);
    });

    function toggleAttack() {
      attackMode = !attackMode;
      fetch('attack_toggle?state=' + (attackMode ? '1' : '0')).catch(() => {});
    }

    function hexToBuf(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      return bytes.buffer;
    }

    async function decryptPayload(envelope) {
      if (!envelope.encrypted) return envelope;
      try {
        const keyBuf = hexToBuf(envelope.shared_key_hint);
        const ivBuf = hexToBuf(envelope.iv);
        const ctBuf = hexToBuf(envelope.ciphertext);

        const cryptoKey = await window.crypto.subtle.importKey(
          "raw", keyBuf, { name: "AES-GCM" }, false, ["decrypt"]
        );
        const ptBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: ivBuf }, cryptoKey, ctBuf
        );
        return JSON.parse(new TextDecoder().decode(ptBuf));
      } catch (e) {
        // Authentication Tag Mismatch / Eve Intercept
        return {
          auth_failed: true,
          qber: envelope.qber_unencrypted || 0.25
        };
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.002;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const dist = Math.sqrt(x*x + z*z);
        const warp = Math.sin(dist * 0.4 - time) * amplitude * Math.exp(-dist * 0.08);
        pos.setY(i, warp);
        const norm = Math.min(Math.max((warp + amplitude) / (amplitude * 2), 0.0), 1.0);
        if (attackMode) {
          colAttr.setXYZ(i, 1.0, 0.1 * norm, 0.3);
        } else {
          colAttr.setXYZ(i, norm * 0.8, 1.0 - (norm * 0.6), 1.0);
        }
      }
      pos.needsUpdate = true;
      colAttr.needsUpdate = true;
      plane.rotation.y += 0.0008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    async function pollTelemetry() {
      try {
        const res = await fetch('telemetry.json?t=' + Date.now());
        if (!res.ok) return;
        const envelope = await res.json();
        const data = await decryptPayload(envelope);

        const badge = document.getElementById('status-badge');
        const qberElem = document.getElementById('qber');

        if (data.auth_failed || (data.security && data.security.qber > 0.11)) {
          badge.className = 'badge badge-alert';
          badge.innerText = 'TAG_MISMATCH // TAMPER DETECTED';
          qberElem.style.color = '#ff3366';
          qberElem.innerText = ((data.qber || 0.248) * 100).toFixed(2) + '%';
          document.getElementById('key').innerText = 'REVOKED_AUTH_FAIL';
          attackMode = true;
          return;
        }

        attackMode = false;
        badge.className = 'badge badge-ok';
        badge.innerText = 'GCM_AUTHENTICATED';
        document.getElementById('tick').innerText = data.tick;
        qberElem.style.color = '#ffffff';
        qberElem.innerText = (data.security.qber * 100).toFixed(2) + '%';
        document.getElementById('kme').innerText = data.security.kme_token || '--';
        document.getElementById('key').innerText = envelope.shared_key_hint.substr(0, 16) + '...';
        document.getElementById('r00').innerText = Number(data.physics.metric_r00).toFixed(6);
            if (data.physics.hamiltonian_loss !== undefined) {
              document.getElementById('pinn-loss').innerText = Number(data.physics.hamiltonian_loss).toFixed(6);
              document.getElementById('gamma-r').innerText = Number(data.physics.christoffel_gamma_r).toFixed(6);
            }
        targetCurvature = data.physics.metric_r00;
      } catch (e) {}
    }

    setInterval(pollTelemetry, 200);
  </script>
</body>
</html>
