<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum-OS // Integrated Cockpit</title>
  <style>
    body { margin: 0; overflow: hidden; background: #080c14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(13, 20, 36, 0.85); border: 1px solid #1f3056;
      border-radius: 8px; padding: 18px 24px; color: #a4b3d6; font-size: 13px;
      backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #hud h1 { margin: 0 0 12px 0; font-size: 14px; letter-spacing: 1.5px; color: #00ffcc; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 6px; }
    .val { font-weight: 600; color: #ffffff; }
    .badge { background: #00ffcc22; color: #00ffcc; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h1>Quantum-OS Dynamic Bridge</h1>
    <div class="row"><span>Status:</span><span class="badge">LIVE ORCHESTRATION</span></div>
    <div class="row"><span>Frame Tick:</span><span id="tick" class="val">0</span></div>
    <div class="row"><span>QBER (BB84):</span><span id="qber" class="val">0.00%</span></div>
    <div class="row"><span>Active KME ID:</span><span id="kme" class="val">--</span></div>
    <div class="row"><span>Session Key (Hybrid):</span><span id="key" class="val">--</span></div>
    <div class="row"><span>Curvature Metric (R_00):</span><span id="r00" class="val">1.0000</span></div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const size = 30, divisions = 30;
    const geometry = new THREE.PlaneGeometry(size, size, divisions, divisions);
    geometry.rotateX(-Math.PI / 2);

    const material = new THREE.MeshBasicMaterial({ color: 0x00a3ff, wireframe: true });
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    let targetCurvature = 1.0;
    const pos = geometry.attributes.position;

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.002;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const dist = Math.sqrt(x*x + z*z);
        const warp = Math.sin(dist * 0.5 - time) * (2.0 - targetCurvature * 1.5) * Math.exp(-dist * 0.1);
        pos.setY(i, warp);
      }
      pos.needsUpdate = true;
      plane.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function updateTelemetry(data) {
      document.getElementById('tick').innerText = data.tick;
      document.getElementById('qber').innerText = (data.security.qber * 100).toFixed(2) + '%';
      document.getElementById('kme').innerText = data.security.kme_id || data.security.kme_token;
      document.getElementById('key').innerText = data.security.session_key;
      document.getElementById('r00').innerText = data.physics.metric_r00;
      targetCurvature = data.physics.metric_r00;
    }
  </script>
</body>
</html>
