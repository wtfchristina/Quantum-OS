<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum-OS // Kerr Relativistic Cockpit</title>
  <style>
    body { margin: 0; overflow: hidden; background: #020408; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(4, 8, 18, 0.94); border: 1px solid #14223d;
      border-radius: 8px; padding: 18px 24px; color: #8ea5d0; font-size: 13px;
      backdrop-filter: blur(12px); box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      width: 350px;
    }
    #hud h1 { margin: 0 0 12px 0; font-size: 13px; letter-spacing: 1.5px; color: #00ffcc; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
    .val { font-weight: 600; color: #ffffff; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-ok { background: #00ffcc22; color: #00ffcc; border: 1px solid #00ffcc55; }
    .badge-alert { background: #ff005533; color: #ff3366; border: 1px solid #ff0055; }
    hr { border: none; border-top: 1px solid #14223d; margin: 12px 0; }
    .control-label { font-size: 11px; color: #647baf; margin-bottom: 4px; display: block; }
    input[type=range] { width: 100%; accent-color: #00ffcc; margin-bottom: 8px; }
    .btn {
      width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ff3366;
      background: #ff336622; color: #ff3366; font-family: monospace; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #ff336644; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h1>Quantum-OS Kerr Cockpit</h1>
    <div class="row"><span>Status:</span><span id="status-badge" class="badge badge-ok">GCM_AUTHENTICATED</span></div>
    <div class="row"><span>Frame Tick:</span><span id="tick" class="val">0</span></div>
    <div class="row"><span>QBER (BB84):</span><span id="qber" class="val">0.00%</span></div>
    <div class="row"><span>KME Key ID:</span><span id="kme" class="val">--</span></div>
    <div class="row"><span>Metric g₀₀:</span><span id="r00" class="val">1.000000</span></div>
    <div class="row"><span>Orbital Radius (r):</span><span id="orbit-r" class="val">8.0000</span></div>
    <div class="row"><span>Frame Dragging (ω):</span><span id="omega-fd" class="val">0.000000</span></div>
    <div class="row"><span>PINN Loss:</span><span id="pinn-loss" class="val">0.000000</span></div>
    <hr>
    <label class="control-label">Curvature Mesh Amplitude</label>
    <input type="range" id="amp-slider" min="0.5" max="4.0" step="0.1" value="1.8">
    <label class="control-label">Camera Pitch Elevation</label>
    <input type="range" id="cam-slider" min="5" max="40" step="1" value="18">
    <button class="btn" onclick="toggleAttack()">INJECT EVE INTERCEPT</button>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020408, 0.02);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById("canvas-container").appendChild(renderer.domElement);

    const uniforms = {
      uTime: { value: 0.0 },
      uG00: { value: 0.75 },
      uOmega: { value: 0.015 },
      uAmplitude: { value: 1.8 },
      uAttack: { value: 0.0 }
    };

    const vertexShader = `
      uniform float uTime;
      uniform float uG00;
      uniform float uAmplitude;
      varying vec3 vWorldPos;
      varying float vWarp;
      varying float vDist;

      void main() {
        vec3 pos = position;
        float dist = length(pos.xz);
        vDist = dist;

        float wave = sin(dist * 0.45 - uTime * 2.2) * uAmplitude * exp(-dist * 0.08) * smoothstep(1.5, 4.5, dist);
        float well = (1.0 - uG00) * 3.8 / (dist * 0.22 + 1.0);

        pos.y = wave - well;
        vWarp = pos.y;
        vWorldPos = pos;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const fragmentShader = `
      uniform float uAttack;
      uniform float uOmega;
      varying vec3 vWorldPos;
      varying float vWarp;
      varying float vDist;

      void main() {
        // Relativistic Doppler beaming along azimuth:
        // Approaching side (x > 0) is blue-shifted & brighter; receding side (x < 0) is redshifted & dimmer
        float doppler = 1.0 + clamp((vWorldPos.x / (vDist + 0.1)) * uOmega * 12.0, -0.65, 0.85);

        vec3 colCyan = vec3(0.0, 0.95, 0.8) * doppler;
        vec3 colViolet = vec3(0.65, 0.1, 0.85) / max(doppler, 0.4);
        vec3 colAlert = vec3(1.0, 0.05, 0.25);

        float norm = clamp((vWarp + 2.0) / 4.0, 0.0, 1.0);
        vec3 baseColor = mix(colViolet, colCyan, norm);
        vec3 finalColor = mix(baseColor, colAlert, uAttack);

        float edgeFade = 1.0 - smoothstep(12.0, 20.0, vDist);
        gl_FragColor = vec4(finalColor, 0.85 * edgeFade);
      }
    `;

    const planeGeom = new THREE.PlaneGeometry(42, 42, 70, 70);
    planeGeom.rotateX(-Math.PI / 2);

    const shaderMaterial = new THREE.ShaderMaterial({
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      uniforms: uniforms,
      wireframe: true,
      transparent: true
    });
    const mesh = new THREE.Mesh(planeGeom, shaderMaterial);
    scene.add(mesh);

    // Kerr Event Horizon (r_+) Proxy Sphere
    const rPlus = 1.0 + Math.sqrt(Math.max(0.0, 1.0 - 0.85 * 0.85)); // M=1, a=0.85 => ~1.52
    const horizonGeom = new THREE.SphereGeometry(rPlus, 24, 24);
    const horizonMat = new THREE.MeshBasicMaterial({ color: 0x050811, wireframe: false });
    const horizonMesh = new THREE.Mesh(horizonGeom, horizonMat);
    scene.add(horizonMesh);

    // Kerr Ergosphere (r_E) Equatorial Ring
    const ergoGeom = new THREE.RingGeometry(rPlus * 1.02, 2.0, 32);
    ergoGeom.rotateX(-Math.PI / 2);
    const ergoMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.35 });
    const ergoMesh = new THREE.Mesh(ergoGeom, ergoMat);
    scene.add(ergoMesh);

    // Orbiting Photon / Particle
    const orbGeom = new THREE.SphereGeometry(0.35, 16, 16);
    const orbMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
    const orbMesh = new THREE.Mesh(orbGeom, orbMat);
    scene.add(orbMesh);

    // Worldline Ribbon Trail
    const MAX_TRAIL = 240;
    const trailPositions = new Float32Array(MAX_TRAIL * 3);
    const trailGeom = new THREE.BufferGeometry();
    trailGeom.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
    const trailMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.95, linewidth: 2 });
    const trailLine = new THREE.Line(trailGeom, trailMat);
    scene.add(trailLine);

    let trailCount = 0;

    function addTrailPoint(x, y, z) {
      if (trailCount === 0) {
        for (let i = 0; i < MAX_TRAIL; i++) {
          trailPositions[i * 3] = x;
          trailPositions[i * 3 + 1] = y;
          trailPositions[i * 3 + 2] = z;
        }
      } else {
        trailPositions.copyWithin(0, 3);
        trailPositions[(MAX_TRAIL - 1) * 3] = x;
        trailPositions[(MAX_TRAIL - 1) * 3 + 1] = y;
        trailPositions[(MAX_TRAIL - 1) * 3 + 2] = z;
      }
      trailCount = Math.min(trailCount + 1, MAX_TRAIL);
      trailGeom.attributes.position.needsUpdate = true;
      trailGeom.setDrawRange(0, trailCount);
    }

        // 800-Particle Accretion Swarm with Kerr Differential Rotation
    const SWARM_COUNT = 800;
    const swarmGeom = new THREE.BufferGeometry();
    const swarmPos = new Float32Array(SWARM_COUNT * 3);
    const swarmColors = new Float32Array(SWARM_COUNT * 3);
    const swarmRadii = new Float32Array(SWARM_COUNT);
    const swarmAngles = new Float32Array(SWARM_COUNT);
    const swarmSpeeds = new Float32Array(SWARM_COUNT);

    const spinA = 0.85;
    for (let i = 0; i < SWARM_COUNT; i++) {
      const r = 2.4 + Math.random() * 11.0;
      const phi = Math.random() * Math.PI * 2.0;
      // Kerr prograde circular orbital angular velocity
      const omegaK = 1.0 / (Math.pow(r, 1.5) + spinA);

      swarmRadii[i] = r;
      swarmAngles[i] = phi;
      swarmSpeeds[i] = omegaK * 0.45;

      swarmPos[i * 3] = r * Math.cos(phi);
      swarmPos[i * 3 + 1] = 0;
      swarmPos[i * 3 + 2] = r * Math.sin(phi);

      // Default cyan-blue glow
      swarmColors[i * 3] = 0.0;
      swarmColors[i * 3 + 1] = 0.8;
      swarmColors[i * 3 + 2] = 1.0;
    }

    swarmGeom.setAttribute('position', new THREE.BufferAttribute(swarmPos, 3));
    swarmGeom.setAttribute('color', new THREE.BufferAttribute(swarmColors, 3));

    const swarmMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });
    const swarmMesh = new THREE.Points(swarmGeom, swarmMat);
    scene.add(swarmMesh);

    document.getElementById("amp-slider").addEventListener("input", (e) => {
      uniforms.uAmplitude.value = parseFloat(e.target.value);
    });
    document.getElementById("cam-slider").addEventListener("input", (e) => {
      camera.position.y = parseFloat(e.target.value);
      camera.lookAt(0, 0, 0);
    });

    function toggleAttack() {
      fetch("attack_toggle").catch(() => {});
    }

    function animate(t) {
      requestAnimationFrame(animate);
      uniforms.uTime.value = t * 0.001;
      mesh.rotation.y += 0.0008;
      ergoMesh.rotation.y += 0.002;
      // trailLine locked to world space
      // Update accretion particle swarm along Kerr metric
      const sPos = swarmGeom.attributes.position.array;
      const sCol = swarmGeom.attributes.color.array;
      const uT = uniforms.uTime.value;
      const uAmp = uniforms.uAmplitude.value;
      const uG = uniforms.uG00.value;
      const isAtt = uniforms.uAttack.value > 0.5;

      for (let i = 0; i < SWARM_COUNT; i++) {
        swarmAngles[i] += swarmSpeeds[i] * 0.025;
        const r = swarmRadii[i];
        const a = swarmAngles[i];
        const px = r * Math.cos(a);
        const pz = r * Math.sin(a);

        // Calculate surface height
        const wWave = Math.sin(r * 0.45 - uT * 2.2) * uAmp * Math.exp(-r * 0.08) * (r < 4.5 ? (r - 1.5) / 3.0 : 1.0);
        const wWell = (1.0 - uG) * 3.8 / (r * 0.22 + 1.0);
        const py = wWave - wWell + 0.08;

        sPos[i * 3] = px;
        sPos[i * 3 + 1] = py;
        sPos[i * 3 + 2] = pz;

        // Relativistic Doppler beaming on particle swarm
        const vX = -Math.sin(a);
        const doppler = 1.0 + vX * 0.45;
        if (isAtt) {
          sCol[i * 3] = 1.0;
          sCol[i * 3 + 1] = 0.05;
          sCol[i * 3 + 2] = 0.2;
        } else {
          sCol[i * 3] = Math.min(1.0, 0.1 * doppler);
          sCol[i * 3 + 1] = Math.min(1.0, 0.85 * doppler);
          sCol[i * 3 + 2] = Math.min(1.0, 1.0 * doppler);
        }
      }
      swarmGeom.attributes.position.needsUpdate = true;
      swarmGeom.attributes.color.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function hexToBuf(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      return bytes.buffer;
    }

    async function pollTelemetry() {
      try {
        const res = await fetch("telemetry.json?t=" + Date.now());
        if (!res.ok) return;
        const envelope = await res.json();

        let data = null;
        try {
          const keyBuf = hexToBuf(envelope.shared_key_hint);
          const ivBuf = hexToBuf(envelope.iv);
          const ctBuf = hexToBuf(envelope.ciphertext);
          const cryptoKey = await window.crypto.subtle.importKey("raw", keyBuf, { name: "AES-GCM" }, false, ["decrypt"]);
          const ptBuf = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBuf }, cryptoKey, ctBuf);
          data = JSON.parse(new TextDecoder().decode(ptBuf));
        } catch (e) {
          data = { auth_failed: true, qber: envelope.qber_unencrypted || 0.245 };
        }

        const badge = document.getElementById("status-badge");
        const qberElem = document.getElementById("qber");

        if (data.auth_failed || (data.security && data.security.qber > 0.11)) {
          badge.className = "badge badge-alert";
          badge.innerText = "TAG_MISMATCH // TAMPER DETECTED";
          qberElem.style.color = "#ff3366";
          qberElem.innerText = ((data.qber || 0.245) * 100).toFixed(2) + "%";
          uniforms.uAttack.value = 1.0;
          orbMat.color.setHex(0xff0055);
        } else {
          badge.className = "badge badge-ok";
          badge.innerText = "GCM_AUTHENTICATED";
          qberElem.style.color = "#ffffff";
          qberElem.innerText = (data.security.qber * 100).toFixed(2) + "%";
          uniforms.uAttack.value = 0.0;
          orbMat.color.setHex(0x00ffcc);

          document.getElementById("tick").innerText = data.tick;
          document.getElementById("kme").innerText = data.security.kme_token || "--";
          document.getElementById("r00").innerText = Number(data.physics.metric_r00).toFixed(6);
          document.getElementById("orbit-r").innerText = Number(data.physics.orbit_radius || 8.0).toFixed(4);
          document.getElementById("omega-fd").innerText = Number(data.physics.frame_drag_omega || 0.0).toFixed(6);
          document.getElementById("pinn-loss").innerText = Number(data.physics.hamiltonian_loss).toFixed(6);

          uniforms.uG00.value = data.physics.metric_r00;
          uniforms.uOmega.value = data.physics.frame_drag_omega || 0.015;

          if (data.physics.orbit_x !== undefined) {
            const px = data.physics.orbit_x;
            const pz = data.physics.orbit_z;
            const dist = Math.sqrt(px * px + pz * pz);
            const t = uniforms.uTime.value;
            const amp = uniforms.uAmplitude.value;
            const g00 = uniforms.uG00.value;

            // Match vertex shader displacement exactly
            const wave = Math.sin(dist * 0.45 - t * 2.2) * amp * Math.exp(-dist * 0.08);
            const well = (1.0 - g00) * 3.8 / (dist * 0.22 + 1.0);
            const py = wave - well;

            orbMesh.position.set(px, py + 0.25, pz);
            addTrailPoint(px, py + 0.25, pz);
          }
        }
      } catch (err) {}
    }

    setInterval(pollTelemetry, 100);
  </script>
</body>
</html>
